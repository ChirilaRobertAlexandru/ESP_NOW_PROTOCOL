; Setări comune
[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; 1. Mediul pentru testul OLED
[env:display]
build_src_filter = -<*> +<Display Test/displayTest.cpp>
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9

; 2. Mediul pentru aflarea adresei MAC
[env:mac]
build_src_filter = -<*> +<MAC/findMac.cpp>

; 3. Mediul pentru testul LED-urilor
[env:led]
build_src_filter = -<*> +<LED/LED_turn_off_on.cpp>
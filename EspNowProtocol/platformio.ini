; Setări comune
[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
;Mai  departe logica este in felul urmator: -<*> sterg absolut toate fisierele
;                                           +<...> adaug la compilat exact fisierul dorit
; 1. Mediul pentru testul OLED
[env:display]
build_src_filter = -<*> +<TEST_FILE/Display Test/displayTest.cpp>
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9

; 2. Mediul pentru aflarea adresei MAC
[env:mac]
build_src_filter = -<*> +<TEST_FILE/MAC/findMac.cpp>

; 3. Mediul pentru testul LED-urilor
[env:led]
build_src_filter = -<*> +<TEST_FILE/LED/LED_turn_off_on.cpp>

;4. Mediul pnetru comanda din serial la lcd si led
[env:lcd_led]
build_src_filter = -<*> +<EXERCISES/Display and LED/lcd_led.cpp>
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9

; 5. ESP-NOW Placa 1
[env:esp1]
build_src_filter = -<*> +<TEST_FILE/Conectare ESP to ESP/esp1.cpp>

; 6. ESP-NOW Placa 2
[env:esp2]
build_src_filter = -<*> +<TEST_FILE/Conectare ESP to ESP/esp2.cpp>